name: GitHub Pages

on:
  push:
    branches: [master]
    paths: ["crates/**", ".github/workflows/gh-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
      - run: cargo install --locked dioxus-cli
      - name: Build graphtron-demo
        working-directory: crates/graphtron-demo
        run: dx build --release --platform web --base-path /graphtron/
      # GitHub Pages serves static files only; client-side routing needs a
      # physical rrdtool/index.html for /graphtron/rrdtool to resolve.
      - name: Copy index.html to rrdtool/ for static routing
        run: |
          mkdir -p target/dx/graphtron-demo/release/web/public/rrdtool
          cp target/dx/graphtron-demo/release/web/public/index.html \
             target/dx/graphtron-demo/release/web/public/rrdtool/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: target/dx/graphtron-demo/release/web/public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v4
