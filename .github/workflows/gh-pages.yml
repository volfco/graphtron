name: GitHub Pages

on:
  push:
    branches: [master]
    paths: ["crates/**", ".github/workflows/gh-pages.yml"]
  pull_request:
    paths: ["crates/**", ".github/workflows/gh-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --all-targets --locked
      - name: Check graphtron for WASM
        run: cargo check -p graphtron --features web --target wasm32-unknown-unknown --locked
      - name: Check graphtron-dioxus for WASM
        run: cargo check -p graphtron-dioxus --target wasm32-unknown-unknown --locked
      - name: Check graphtron-demo for WASM
        run: cargo check -p graphtron-demo --target wasm32-unknown-unknown --locked

  build:
    needs: verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
      - run: cargo install --locked dioxus-cli
      - name: Build graphtron-demo
        working-directory: crates/graphtron-demo
        run: dx build --release --platform web --base-path /graphtron/
      # GitHub Pages serves static files only; client-side routing needs a
      # physical rrdtool/index.html for /graphtron/rrdtool to resolve.
      - name: Copy index.html to rrdtool/ for static routing
        run: |
          mkdir -p target/dx/graphtron-demo/release/web/public/rrdtool
          cp target/dx/graphtron-demo/release/web/public/index.html \
             target/dx/graphtron-demo/release/web/public/rrdtool/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: target/dx/graphtron-demo/release/web/public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v4
