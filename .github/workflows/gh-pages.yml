name: GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "rust-toolchain*"
      - "rustfmt.toml"
      - ".github/workflows/gh-pages.yml"
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "rust-toolchain*"
      - "rustfmt.toml"
      - ".github/workflows/gh-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          target: wasm32-unknown-unknown
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --all-targets --locked
      - name: Check graphtron for WASM
        run: cargo check -p graphtron --features web --target wasm32-unknown-unknown --locked
      - name: Check graphtron-dioxus for WASM
        run: cargo check -p graphtron-dioxus --target wasm32-unknown-unknown --locked
      - name: Check graphtron-demo for WASM
        run: cargo check -p graphtron-demo --target wasm32-unknown-unknown --locked

  build:
    needs: verification
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          target: wasm32-unknown-unknown
      - run: cargo install --locked dioxus-cli --version 0.7.10
      - name: Build graphtron-demo
        working-directory: crates/graphtron-demo
        run: dx build --release --platform web --base-path /graphtron/
      # GitHub Pages serves static files only; client-side routing needs a
      # physical rrdtool/index.html for /graphtron/rrdtool to resolve.
      - name: Copy index.html to rrdtool/ for static routing
        run: |
          mkdir -p target/dx/graphtron-demo/release/web/public/rrdtool
          cp target/dx/graphtron-demo/release/web/public/index.html \
             target/dx/graphtron-demo/release/web/public/rrdtool/index.html
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: target/dx/graphtron-demo/release/web/public
  browser:
    needs: verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          target: wasm32-unknown-unknown
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: cargo install --locked dioxus-cli --version 0.7.10
      - run: cargo install --locked wasm-bindgen-cli --version 0.2.128
      - run: npm install --global playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Build browser fixture
        run: |
          cargo build -p graphtron --example browser_fixture --features web --target wasm32-unknown-unknown --locked
          mkdir -p target/graphtron-browser
          wasm-bindgen target/wasm32-unknown-unknown/debug/examples/browser_fixture.wasm --target web --out-dir target/graphtron-browser
      - name: Build demo for browser tests
        working-directory: crates/graphtron-demo
        run: dx build --platform web
      - name: Run browser regression suites
        run: |
          export NODE_PATH="$(npm root --global)"
          node crates/graphtron/tests/browser.cjs
          node crates/graphtron-demo/tests/browser.cjs
          node crates/graphtron-demo/tests/rrd-browser.cjs
  deploy:
    needs: [build, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
