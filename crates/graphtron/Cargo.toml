[package]
name = "graphtron"
version = "0.1.0"
authors = ["colum <git@volf.co>"]
edition = "2024"
publish = false
description = "Pure-Rust Canvas2D time-series chart renderer"

[dependencies]
serde = { version = "1", features = ["derive"] }
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "Window",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "CanvasGradient",
    "TextMetrics",
    "Element",
    "CssStyleDeclaration",
    "DomRect",
    "Touch",
    "TouchList",
    "KeyboardEvent",
] }

[features]
default = []
web = ["dep:web-sys", "dep:js-sys", "dep:wasm-bindgen"]

[dev-dependencies]
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "geometry"
harness = false

# Deterministic browser fixtures exercised by tests/browser.cjs.
[[example]]
name = "browser_fixture"
crate-type = ["cdylib"]
required-features = ["web"]
